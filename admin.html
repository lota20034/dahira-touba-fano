<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pannello admin | Dahira Touba Fano</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0e2a14">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css?v=3">
<style>
/* Pannello: tutto pensato per il telefono, comodo anche sul computer */
body{background:#f1ede4}
.ad-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--green);color:var(--gold2);border-bottom:1px solid rgba(201,168,76,.3)}
.ad-top .wrap{display:flex;align-items:center;gap:.8rem;min-height:58px}
.ad-top b{font-family:var(--display);color:#fff;font-size:1.05rem}
.ad-top a,.ad-top button{color:var(--gold2);font-size:.85rem}
.ad-top .sp{margin-left:auto;display:flex;gap:.6rem;align-items:center}
.ad-top button{background:none;border:1px solid rgba(201,168,76,.5);padding:.45rem .8rem;min-height:38px;cursor:pointer;font-weight:600}
.tabs{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:39;background:#fff;border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:.2rem;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:.9rem .9rem .75rem;font-weight:600;font-size:.92rem;color:var(--muted);cursor:pointer;min-height:48px}
.tabs button[aria-selected="true"]{color:var(--green);border-bottom-color:var(--gold)}
.panel{padding-block:1.5rem 4rem}
.box{background:#fff;border:1px solid var(--line);padding:clamp(1rem,3vw,1.6rem);margin-bottom:1.2rem;display:grid;gap:1rem}
.box h2{font-size:1.35rem;color:var(--green)}
.box h3{font-size:1.1rem;color:var(--green)}
.box .hint{color:var(--muted);font-size:.88rem}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:.9rem}
label.f{display:grid;gap:.35rem;font-size:.82rem;font-weight:600;color:var(--green)}
label.f small{font-weight:400;color:var(--muted)}
.f input,.f textarea,.f select{width:100%;font:inherit;font-size:16px;font-weight:400;color:var(--ink);padding:.7rem .8rem;border:1px solid #cfc6b2;background:#fffdf8;border-radius:0}
.f textarea{min-height:110px;resize:vertical;line-height:1.5}
.f input:focus,.f textarea:focus,.f select:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
.check{display:flex;align-items:center;gap:.6rem;font-size:.92rem;font-weight:600;color:var(--green);cursor:pointer;min-height:40px}
.check input{width:22px;height:22px;accent-color:var(--green)}
.bar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.b{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:44px;padding:.55rem 1rem;font:600 .9rem var(--body);border:1px solid var(--green);background:var(--green);color:var(--gold2);cursor:pointer}
.b.gold{background:var(--gold);border-color:var(--gold);color:var(--green)}
.b.line{background:#fff;color:var(--green)}
.b.red{background:#fff;color:#a12a1e;border-color:#d9b3ad}
.b.red.sure{background:#a12a1e;color:#fff}
.b.sm{min-height:36px;padding:.35rem .7rem;font-size:.82rem}
.b:disabled{opacity:.5;cursor:default}
.msg{font-size:.9rem;padding:.6rem .8rem;border-left:3px solid var(--gold);background:#fbf6e7}
.msg.err{border-color:#a12a1e;background:#fbecea;color:#7a1d14}
.msg.ok{border-color:#2e7d43;background:#eaf5ec;color:#1f5a2e}
.list{display:grid;gap:.6rem}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.8rem;align-items:center;border:1px solid var(--line);padding:.6rem;background:#fffdf8}
.item img,.item .ph{width:58px;height:58px;object-fit:cover;background:var(--green2)}
.item .ph{display:grid;place-items:center;color:var(--gold2);font-weight:700}
.item b{display:block;color:var(--green);overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--muted)}
.tag{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.15rem .45rem;background:var(--gold2);color:var(--green);margin-right:.3rem}
.tag.past{background:#e6e1d6;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:.7rem}
.card{border:1px solid var(--line);background:#fffdf8;display:grid}
.card .th{position:relative;aspect-ratio:1;background:var(--green2);overflow:hidden}
.card .th img{width:100%;height:100%;object-fit:cover}
.card .th .yt{position:absolute;left:.4rem;top:.4rem;background:#c4302b;color:#fff;font-size:.7rem;font-weight:700;padding:.1rem .4rem}
.card .th .cov{position:absolute;right:.4rem;top:.4rem;background:var(--gold);color:var(--green);font-size:.7rem;font-weight:700;padding:.1rem .4rem}
.card .bd{padding:.6rem;display:grid;gap:.5rem}
.card .bd input[data-f]{font-size:16px;padding:.45rem .55rem;border:1px solid #cfc6b2;width:100%}
.card .bd .bar{gap:.35rem}
.card .bd select{font-size:14px;padding:.35rem;border:1px solid #cfc6b2;width:100%;min-width:0}
.grid > *,.row > *,.box > *{min-width:0}
.f select{text-overflow:ellipsis}
.drop{border:2px dashed #c9b88a;background:#fffbef;padding:1.4rem;text-align:center;display:grid;gap:.6rem;justify-items:center;cursor:pointer}
.drop.over{background:#f6edcf}
.drop b{color:var(--green)}
.prog{display:grid;gap:.3rem;font-size:.85rem}
.pbar{height:8px;background:#ece5d4}
.pbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.login{max-width:420px;margin:clamp(2rem,10vh,6rem) auto;padding-inline:var(--gl) var(--gr)}
.login .box{padding:2rem}
.login h1{font-size:1.6rem;color:var(--green);text-align:center}
.login img{width:72px;height:72px;border-radius:50%;margin:0 auto;border:1px solid var(--gold)}
.prog-rows{display:grid;gap:.4rem}
.prog-rows .pr{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:.4rem}
.prog-rows input{font-size:16px;padding:.5rem;border:1px solid #cfc6b2;width:100%}
details.sec{border:1px solid var(--line);background:#fffdf8}
details.sec summary{cursor:pointer;padding:.9rem 1rem;font-weight:700;color:var(--green);display:flex;align-items:center;gap:.7rem;list-style:none}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary .medal{width:40px;flex:none}
details.sec > div{padding:0 1rem 1rem;display:grid;gap:1rem}
.cover-prev{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.cover-prev img{width:160px;aspect-ratio:16/9;object-fit:cover;border:1px solid var(--line)}
.sticky-save{position:sticky;bottom:0;background:linear-gradient(transparent,#f1ede4 30%);padding:1rem 0 calc(1rem + env(safe-area-inset-bottom,0px));z-index:5}
</style>
</head>
<body>

<div id="loginView" class="login" hidden>
  <form class="box" id="loginForm">
    <img src="img/logo-192.webp" alt="">
    <h1>Area riservata</h1>
    <p class="hint" style="text-align:center">Dahira Touba Fano · Keur Serigne Touba Fano</p>
    <label class="f">Email<input id="lEmail" type="email" autocomplete="username" required></label>
    <label class="f">Password<input id="lPass" type="password" autocomplete="current-password" required></label>
    <button class="b gold" type="submit">Entra</button>
    <div id="lMsg"></div>
  </form>
</div>

<div id="appView" hidden>
  <header class="ad-top"><div class="wrap"><img src="img/logo-192.webp" alt="" width="34" height="34" style="border-radius:50%;border:1px solid var(--gold)"><b>Pannello admin</b>
    <span class="sp"><a href="index.html" target="_blank" rel="noopener">Vedi il sito ↗</a><button type="button" id="logout">Esci</button></span></div></header>
  <nav class="tabs"><div class="wrap" role="tablist">
    <button role="tab" data-tab="eventi" aria-selected="true">Eventi</button>
    <button role="tab" data-tab="foto">Foto e album</button>
    <button role="tab" data-tab="commissioni">Commissioni</button>
    <button role="tab" data-tab="citazioni">Citazioni e Yobalou</button>
    <button role="tab" data-tab="impostazioni">Orari e Diayanté</button>
  </div></nav>
  <main class="wrap panel">
    <section data-panel="eventi"></section>
    <section data-panel="foto" hidden></section>
    <section data-panel="commissioni" hidden></section>
    <section data-panel="citazioni" hidden></section>
    <section data-panel="impostazioni" hidden></section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/app.js?v=1"></script>
<script src="assets/yobalou.js?v=1"></script>
<script src="assets/admin.js?v=2"></script>
</body>
</html>
